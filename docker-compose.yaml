services:
    postgres:
      container_name: postgres
      image: postgres:16
      environment:
        POSTGRES_DB: marketplace_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      networks:
        - marketplace-net
#      healthcheck:
#        test: [ "CMD-SHELL", "pg_isready -U postgres -d marketplace_db" ]
#        interval: 10s
#        timeout: 5s
#        retries: 5
#        start_period: 10s


    backend:
      container_name: backend
      build: .
      environment:
        POSTGRES_DB: marketplace_db
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        JWT_SECRET: ${JWT_SECRET}
      ports:
        - "8080:8080"
      networks:
        - marketplace-net
#      healthcheck:
#        test: [ "CMD-SHELL", "pg_isready -U postgres -d marketplace_db" ]
#        interval: 10s
#        timeout: 5s
#        retries: 5
#        start_period: 10s

volumes:
  postgres_data:

networks:
  marketplace-net:
    driver: bridge
